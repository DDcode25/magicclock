; Probe firmware for JUZIPi SD PRO "Smart Weather Clock" (ESP8266, 4 MB flash).
; Flashed via the stock page: POST /update_ota, field "update", file name must start with "SDP".
; Keeps the stock 4M3M layout (LittleFS at 0x100000, 0x2FA000 bytes) and never mounts the FS.

[env:sdpro-probe]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.4m3m.ld
monitor_speed = 115200
build_flags = -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

; Same probe on the 4M2M layout (sketch area 2 MB, LittleFS at 0x200000): a step towards ../sdpro,
; whose ~1 MB image does not fit the OTA space the stock 4M3M layout leaves.
[env:sdpro-probe-4m2m]
extends = env:sdpro-probe
board_build.ldscript = eagle.flash.4m2m.ld

; Release loader: no Wi-Fi credentials (uses the network the stock firmware saved), no display test.
; Published as releases/SDP_UASmartBox-SD-loader.bin (the stock page wants names starting with "SDP").
[env:sdpro-loader]
extends = env:sdpro-probe-4m2m
build_flags = ${env:sdpro-probe.build_flags} -DLOADER
