; Magic Box FW: firmware for GeekMagic SmallTV Pro (ESP32-WROOM-32, 8 MB flash, no PSRAM).
; Arduino-ESP32 2.0.x (ESP-IDF 4.4) to match the stock bootloader; flashed via OTA only.

[env:smalltv-pro]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_build.partitions = ../partitions_smalltv_pro.csv
monitor_speed = 115200
extra_scripts = pre:tools/embed_web.py
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1
  bitbank2/AnimatedGIF@2.1.1
  bodmer/TJpg_Decoder@1.1.0
; Display wiring recovered from stock TFT_eSPI::init (V3.4.88):
; ST7789 240x240 on VSPI, SCLK 18, MOSI 23, MISO 19, CS 15, DC 2, RST 4,
; BGR order, inversion on. Backlight GPIO25 via LEDC ch0 5 kHz 8-bit. Touch GPIO32.
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DFW_VERSION=\"0.6.0\"
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_ON=1
  -DTFT_MISO=19
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=4
  -DUSE_VSPI_PORT=1
  ; 27 MHz: GIF playback showed corrupted lines at 40 MHz
  -DSPI_FREQUENCY=27000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT7=1
  -DSMOOTH_FONT=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
