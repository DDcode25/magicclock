; UA Smart Box for the JUZIPi SD PRO "Smart Weather Clock" (ESP8266, 4 MB flash, no touch).
; Separate copy of ../firmware with only the weather, clock, alerts and outage apps.
; Flash layout 4M2M: sketch area 2 MB (app up to ~1 MB, room for an OTA copy), LittleFS 2 MB at 0x200000.

[env:sdpro]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts = pre:tools/embed_web.py
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1
; Display wiring found with ../probe8266 on the device:
; ST7789 240x240 on HSPI (SCLK 14, MOSI 13), CS 15, DC 0, RST 2, backlight GPIO5 active low,
; inversion on, BGR order (red and blue were swapped with RGB), SPI mode 3.
build_flags =
  -DFW_VERSION=\"1.0.0-sdpro\"
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_ON=1
  -DTFT_CS=15
  -DTFT_DC=0
  -DTFT_RST=2
  -DTFT_SPI_MODE=SPI_MODE3
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT7=1
  -DSMOOTH_FONT=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
